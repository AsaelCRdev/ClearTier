<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cleartier - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="app-card p-4" style="max-width: 400px; width: 100%;">
      <div class="text-center mb-3">
        <i class="bi bi-shield-fill-check" style="font-size:1.8rem; color:var(--accent);"></i>
      </div>
      <h1 class="h4 text-center mb-1">Cleartier</h1>
      <p class="text-center mb-4" style="color:var(--text-muted); font-size:0.9rem;">Sign in to access the control panel</p>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="admin-id" class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Admin ID</label>
          <input type="text" class="form-control" id="admin-id" placeholder="admin" required />
        </div>
        <div class="mb-3">
          <label for="security-token" class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Security Token</label>
          <input type="password" class="form-control" id="security-token" placeholder="••••••••" required />
        </div>
        <div id="login-error" class="text-danger small mb-2" style="display:none;"></div>
        <button type="submit" class="btn btn-warning w-100" id="login-submit-btn">Authenticate Session</button>
      </form>
    </div>
  </div>
  <script type="module" src="../ts/pages-init/login.init.ts"></script>
</body>
</html>
