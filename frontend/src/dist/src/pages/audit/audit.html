<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log: ClearTier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/audit-DdyN6mEi.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/tokenStorage-DVhbB3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/navbar-C9i_qDKd.js">
  <link rel="modulepreload" crossorigin href="/assets/auditApi-BS7Bqp6T.js">
  <link rel="modulepreload" crossorigin href="/assets/modal-9Ha9NeQJ.js">
  <link rel="stylesheet" crossorigin href="/assets/tokenStorage-BNE0CuHz.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="sidebar-root"></aside>
    <div class="app-main">
      <header class="app-navbar" id="navbar-root"></header>
      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1">Audit Trail</h1>
            <p style="color:var(--text-muted); font-size:0.9rem;" class="mb-0">Immutable log of all system changes.</p>
          </div>
          <button class="btn btn-outline-light" id="export-csv-btn"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
        </div>

        <div class="app-card mb-3 d-flex gap-2">
          <input type="text" class="form-control" id="filter-input" placeholder="Filter by user or action..." />
          <input type="date" class="form-control" style="max-width:180px;" id="filter-date" />
        </div>

        <div class="app-card p-0">
          <table class="app-table">
            <thead>
              <tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th></tr>
            </thead>
            <tbody id="audit-table-body">
              <tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">Cargando auditoría...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
