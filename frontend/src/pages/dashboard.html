<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard : Cleartier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <!--Botón para abrir el offcanvas (visible en móvil)-->
  <nav class="mobile-navbar" id="mobileNavbar">
    <div class="brand">
      <i class="bi bi-shield-fill-check"></i>
      <span>Clear Tier</span>
    </div>

    <!-- Botón que abre el offcanvas -->
    <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
      <i class="bi bi-list"></i>
    </button>
  </nav>

  <!--Offcanvas/sidevar para moviles-->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">
        <i class="bi bi-shield-fill-check" style="color: var(--accent);"></i>
        Clear Tier
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" style="padding: 0;">
      <nav class="sidebar-nav" style="padding: 0.5rem 1rem;">
        <a href="#" class="sidebar-link active">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="./employees/users.html" class="sidebar-link">
          <i class="bi bi-people"></i> Users
        </a>
        <a href="./roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="./permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-lock"></i> Permissions
        </a>
        <a href="./audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>
      <div class="sidebar-section-label" style="padding-left: 1rem;">INTELLIGENCE</div>
      <nav class="sidebar-nav" style="padding: 0.5rem 1rem;">
        <a href="./ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </div>
  </div>

  <!--Sidevar de escritorio-->
  <div class="app-shell">
    <aside class="app-sidebar" id="sidebar-root">
      <div class="sidebar-brand">
        <i class="bi bi-shield-fill-check"></i>
        <span>Clear Tier</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="./employees/users.html" class="sidebar-link">
          <i class="bi bi-people"></i> Users
        </a>
        <a href="./roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="./permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-lock"></i> Permissions
        </a>
        <a href="./audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>

      <div class="sidebar-section-label">INTELLIGENCE</div>
      <nav class="sidebar-nav">
        <a href="./ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </aside>

    <!--Contenido principal-->
    <div class="app-main">
      <header class="app-navbar" id="navbar-root">
        <div class="navbar-spacer"></div>
        <div class="navbar-actions">
          <button class="icon-btn position-relative" id="notif-bell" title="Notificaciones">
            <i class="bi bi-bell"></i>
            <span class="notif-dot"></span>
          </button>
          <div class="avatar-circle">A</div>
          <button class="icon-btn" id="logout-btn" title="Cerrar sesión">
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i></a>
          </button>
        </div>
      </header>

      <main class="app-content">

        <h1 class="h4 mb-1">Cleartier</h1>
        <p style="color:var(--text-muted);" class="mb-4">Metricas generales.</p>

        <!-- Tarjetas de métricas -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-sm-6 col-md-3">
            <div class="app-card metric-card">
              <div class="metric-icon"><i class="bi bi-people-fill"></i></div>
              <div>
                <div class="metric-label">Total de Usuarios</div>
                <div class="metric-value" id="metric-total-users">–</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <div class="app-card metric-card">
              <div class="metric-icon"><i class="bi bi-key-fill"></i></div>
              <div>
                <div class="metric-label">Roles activos</div>
                <div class="metric-value" id="metric-active-roles">–</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <div class="app-card metric-card">
              <div class="metric-icon"><i class="bi bi-shield-fill"></i></div>
              <div>
                <div class="metric-label">permisos</div>
                <div class="metric-value" id="metric-permissions">–</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <div class="app-card metric-card">
              <div class="metric-icon" style="color:var(--accent);"><i class="bi bi-clock-history"></i></div>
              <div>
                <div class="metric-label">cambios Recientes (24h)</div>
                <div class="metric-value" style="color:var(--accent);" id="metric-recent-changes">–</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
