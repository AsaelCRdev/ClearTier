<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles: ClearTier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="sidebar-root"></aside>
    <div class="app-main">
      <header class="app-navbar" id="navbar-root"></header>
      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1">Role Definitions</h1>
            <p style="color:var(--text-muted); font-size:0.9rem;" class="mb-0">Create and modify logical groupings of permissions.</p>
          </div>
          <button class="btn btn-warning" id="create-role-btn"><i class="bi bi-plus-lg me-1"></i>Create Role</button>
        </div>

        <!-- Formulario de creación de rol: se muestra dentro de un modal generado por TS -->
        <div class="row g-3" id="roles-grid">
          <div class="col-12 text-center py-4" style="color:var(--text-muted);">Cargando roles...</div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../ts/pages-init/roles.init.ts"></script>
</body>
</html>
