<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log :Cleartier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="app-shell">

    <aside class="app-sidebar" id="sidebar-root">
      <!-- Logo / Brand -->
      <div class="sidebar-brand">
        <i class="bi bi-shield-fill-check"></i>
        <span>Clear Tier</span>
      </div>

      <!-- Navegación principal -->
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="../employees/users.html" class="sidebar-link">
          <i class="bi bi-people-fill"></i> Users
        </a>
        <a href="../roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="../permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-fill-check"></i> Permissions
        </a>
        
        <!-- Aquí está el cambio: movimos la clase "active" a Audit Log -->
        <a href="#" class="sidebar-link active">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>

      <div class="sidebar-section-label">INTELLIGENCE</div>
      <nav class="sidebar-nav">
        <a href="../ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-navbar" id="navbar-root">
         <div class="navbar-spacer"></div>
        <div class="navbar-actions">
          <button class="icon-btn position-relative" id="notif-bell" title="Notificaciones">
            <i class="bi bi-bell"></i>
          <span class="notif-dot"></span>
          </button>
          <div class="avatar-circle">A</div>
          <button class="icon-btn" id="logout-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </header>
      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1">Auditorias</h1>
            <p style="color:var(--text-muted); font-size:0.9rem;" class="mb-0">Cambios en el sistema</p>
          </div>
          <button class="btn btn-outline-light" id="export-csv-btn"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
        </div>

        <div class="app-card mb-3 d-flex gap-2">
          <input type="text" class="form-control" id="filter-input" placeholder="Filter by user or action..." />
          <input type="date" class="form-control" style="max-width:180px;" id="filter-date" />
        </div>

        <div class="app-card p-0">
          <table class="app-table">
            <thead>
              <tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th></tr>
            </thead>
            <tbody id="audit-table-body">
              <tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">Cargando auditoría...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../ts/pages-init/audit.init.ts"></script>
</body>
</html>
