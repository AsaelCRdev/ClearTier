<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente IA Cleartier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="app-shell">

    <aside class="app-sidebar" id="sidebar-root">
      <!-- Logo / Brand -->
      <div class="sidebar-brand">
        <i class="bi bi-shield-fill-check"></i>
        <span>Clear Tier</span>
      </div>

      <!-- Navegación principal -->
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="../employees/users.html" class="sidebar-link">
          <i class="bi bi-people-fill"></i> Users
        </a>
        <a href="../roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="../permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-fill-check"></i> Permissions
        </a>
        <a href="../audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>

      <!-- Sección separadora -->
      <div class="sidebar-section-label">INTELLIGENCE</div>
      
      <nav class="sidebar-nav">
        <!-- Aquí está el cambio: movimos la clase "active" a AI Assistant -->
        <a href="#" class="sidebar-link active">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-navbar" id="navbar-root"></header>
      <main class="app-content d-flex flex-column" style="height: calc(100vh - 60px);">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h1 class="h4 mb-1">Soy tu Asistente</h1>
            <p style="color:var(--text-muted); font-size:0.9rem;" class="mb-0">Modelo de leguage natural</p>
          </div>
          <div class="text-end">
            <span class="badge-pill" style="background: rgba(47,182,115,0.15); color: var(--success);">GEMINI API CONNECTED</span>
            <div class="mt-1" style="font-size:0.78rem; color:var(--text-muted);">
              Quota: <span class="ai-quota-bar"><span class="ai-quota-fill" id="quota-fill"></span></span>
              <span id="quota-label">–/1500 today</span>
            </div>
          </div>
        </div>

        <div class="row g-3 flex-grow-1" style="min-height:0;">
          <div class="col-md-7 d-flex flex-column">
            <div class="app-card flex-grow-1 d-flex flex-column" style="min-height:0;">
              <div id="chat-log" class="d-flex flex-column flex-grow-1" style="overflow-y:auto; padding-right:0.5rem;"></div>
              <form id="prompt-form" class="d-flex gap-2 mt-3">
                <input type="text" class="form-control" id="prompt-input" maxlength="4000"
                       placeholder="Describe the access changes (e.g. 'Create temp viewer role')..." />
                <button type="submit" class="btn btn-warning"><i class="bi bi-arrow-right"></i></button>
              </form>
            </div>
          </div>

          <div class="col-md-5 d-flex flex-column">
            <div class="app-card flex-grow-1 d-flex flex-column" style="min-height:0;">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0">Cambios propuestos</h6>
                <span style="color:var(--text-muted); font-size:0.75rem;">Vista previa</span>
              </div>
              <div id="diff-view" class="flex-grow-1" style="overflow-y:auto; color:var(--text-muted); font-size:0.85rem;">
                No active draft.
              </div>
              <div class="d-flex justify-content-end gap-2 mt-3">
                <button class="btn btn-outline-light" id="discard-btn" disabled>Discard</button>
                <button class="btn btn-warning" id="commit-btn" disabled>Commit Changes</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
