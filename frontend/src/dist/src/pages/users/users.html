<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users: ClearTier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/users-7U546-Je.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/tokenStorage-CrOxvkFu.js">
  <link rel="modulepreload" crossorigin href="/assets/navbar-_zwxLTXP.js">
  <link rel="modulepreload" crossorigin href="/assets/mockBackend-DCdQtm3J.js">
  <link rel="modulepreload" crossorigin href="/assets/userApi-DEcQ1MTA.js">
  <link rel="modulepreload" crossorigin href="/assets/roleApi-Db8IHcct.js">
  <link rel="modulepreload" crossorigin href="/assets/toast-wPD29RCn.js">
  <link rel="modulepreload" crossorigin href="/assets/validators-eXC2fl6a.js">
  <link rel="stylesheet" crossorigin href="/assets/tokenStorage-D2CWYC6G.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="sidebar-root"></aside>
    <div class="app-main">
      <header class="app-navbar" id="navbar-root"></header>
      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 mb-0" id="users-title">User Management</h1>
          <button class="btn btn-warning" id="toggle-form-btn">
            <i class="bi bi-plus-lg me-1"></i><span id="toggle-form-label">Provision User</span>
          </button>
        </div>

        <!-- Formulario de creación: oculto por defecto, se muestra al presionar "Provision User" -->
        <form id="create-user-form" class="app-card mb-3" style="display:none;">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Full Name</label>
              <input type="text" class="form-control" id="input-full-name" placeholder="John Doe" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Email Address</label>
              <input type="email" class="form-control" id="input-email" placeholder="john@company.com" required />
            </div>
            <div class="col-md-2">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Role</label>
              <select class="form-select" id="input-role"></select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-warning w-100">Add User</button>
            </div>
          </div>
          <div id="create-user-error" class="text-danger small mt-2" style="display:none;"></div>
        </form>

        <div class="app-card mb-3">
          <input type="text" class="form-control" id="search-input" placeholder="Search users by name or email..." />
        </div>

        <div class="app-card p-0">
          <table class="app-table">
            <thead>
              <tr><th>Name</th><th>Role</th><th>Status</th><th class="text-end pe-3">Actions</th></tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">Cargando usuarios...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
