<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users :Cleartier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="app-shell">

    <aside class="app-sidebar" id="sidebar-root">
      <!-- Logo / Brand -->
      <div class="sidebar-brand">
        <i class="bi bi-shield-fill-check"></i>
        <span>Clear Tier</span>
      </div>

      <!-- Navegación principal -->
      <nav class="sidebar-nav">
        
        <a href="../dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        
        <!-- Aquí está el cambio: movimos la clase "active" a Users -->
        <a href="#" class="sidebar-link active">
          <i class="bi bi-people-fill"></i> Users
        </a>
        
        <a href="../roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="../permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-lock"></i> Permissions
        </a>
        <a href="../audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>

      <div class="sidebar-section-label">INTELLIGENCE</div>
      <nav class="sidebar-nav">
        <a href="../ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-navbar" id="navbar-root">
         <div class="navbar-spacer"></div>
        <div class="navbar-actions">
          <button class="icon-btn position-relative" id="notif-bell" title="Notificaciones">
            <i class="bi bi-bell"></i>
          <span class="notif-dot"></span>
          </button>
          <div class="avatar-circle">A</div>
          <button class="icon-btn" id="logout-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </header>
      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 mb-0" id="users-title">Administracion de usuarios</h1>
          <button class="btn btn-warning" id="toggle-form-btn">
            <i class="bi bi-plus-lg me-1"></i><span id="toggle-form-label">Provision User</span>
          </button>
        </div>

        <!-- Formulario de creación: oculto por defecto, se muestra al presionar "Provision User" -->
        <form id="create-user-form" class="app-card mb-3" style="display:none;">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Nombre completo</label>
              <input type="text" class="form-control" id="input-full-name" placeholder="John Doe" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">correo electronico</label>
              <input type="email" class="form-control" id="input-email" placeholder="john@company.com" required />
            </div>
            <div class="col-md-2">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Rol</label>
              <select class="form-select" id="input-role"></select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-warning w-100">agregar usuario</button>
            </div>
          </div>
          <div id="create-user-error" class="text-danger small mt-2" style="display:none;"></div>
        </form>

        <div class="app-card mb-3">
          <input type="text" class="form-control" id="search-input" placeholder="Search users by name or email..." />
        </div>

        <div class="app-card p-0">
          <table class="app-table">
            <thead>
              <tr><th>Name</th><th>Role</th><th>Status</th><th class="text-end pe-3">Acciones</th></tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">Cargando usuarios...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
