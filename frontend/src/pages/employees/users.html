<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users : Cleartier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>

  <!--Botón para abrir el offcanvas (visible en móvil)-->
  <nav class="mobile-navbar" id="mobileNavbar">
    <div class="brand">
      <i class="bi bi-shield-fill-check"></i>
      <span>Clear Tier</span>
    </div>
    <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
      <i class="bi bi-list"></i>
    </button>
  </nav>

  <!--Offcanvas/sidevar para moviles-->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">
        <i class="bi bi-shield-fill-check" style="color: var(--accent);"></i>
        Clear Tier
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" style="padding: 0;">
      <nav class="sidebar-nav" style="padding: 0.5rem 1rem;">
        <a href="../dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="#" class="sidebar-link active">
          <i class="bi bi-people-fill"></i> Users
        </a>
        <a href="../roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="../permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-lock"></i> Permissions
        </a>
        <a href="../audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>
      <div class="sidebar-section-label" style="padding-left: 1rem;">INTELLIGENCE</div>
      <nav class="sidebar-nav" style="padding: 0.5rem 1rem;">
        <a href="../ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </div>
  </div>

  <!--Sidevar de escritorio-->
  <div class="app-shell">
    <aside class="app-sidebar" id="sidebar-root">
      <div class="sidebar-brand">
        <i class="bi bi-shield-fill-check"></i>
        <span>Clear Tier</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="#" class="sidebar-link active">
          <i class="bi bi-people-fill"></i> Users
        </a>
        <a href="../roles/roles.html" class="sidebar-link">
          <i class="bi bi-key"></i> Roles
        </a>
        <a href="../permissions/permissions.html" class="sidebar-link">
          <i class="bi bi-shield-lock"></i> Permissions
        </a>
        <a href="../audit/audit.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i> Audit Log
        </a>
      </nav>

      <div class="sidebar-section-label">INTELLIGENCE</div>
      <nav class="sidebar-nav">
        <a href="../ai-assistant/ai_assistant.html" class="sidebar-link">
          <i class="bi bi-robot"></i> AI Assistant
        </a>
      </nav>
    </aside>

    <!--Contenido principal-->
    <div class="app-main">
      <header class="app-navbar" id="navbar-root">
        <div class="navbar-spacer"></div>
        <div class="navbar-actions">
          <button class="icon-btn position-relative" id="notif-bell" title="Notificaciones">
            <i class="bi bi-bell"></i>
            <span class="notif-dot"></span>
          </button>
          <div class="avatar-circle">A</div>
          <button class="icon-btn" id="logout-btn" title="Cerrar sesión">
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i></a>
          </button>
        </div>
      </header>

      <main class="app-content">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h1 class="h4 mb-0" id="users-title">Administracion de usuarios</h1>
          <button class="btn btn-warning" id="toggle-form-btn">
            <i class="bi bi-plus-lg me-1"></i><span id="toggle-form-label">Provision User</span>
          </button>
        </div>

        <!-- Formulario de creación -->
        <form id="create-user-form" class="app-card mb-3" style="display:none;">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Nombre completo</label>
              <input type="text" class="form-control" id="input-full-name" placeholder="John Doe" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">correo electronico</label>
              <input type="email" class="form-control" id="input-email" placeholder="john@company.com" required />
            </div>
            <div class="col-md-2">
              <label class="form-label" style="color:var(--text-muted); font-size:0.85rem;">Rol</label>
              <select class="form-select" id="input-role"></select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-warning w-100">agregar usuario</button>
            </div>
          </div>
          <div id="create-user-error" class="text-danger small mt-2" style="display:none;"></div>
        </form>

        <!-- Buscador -->
        <div class="app-card mb-3">
          <input type="text" class="form-control" id="search-input" placeholder="Search users by name or email..." />
        </div>

        <!-- Tabla de usuarios -->
        <div class="app-card p-0" style="overflow-x: auto;">
          <table class="app-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-end pe-3">Acciones</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr>
                <td colspan="4" class="text-center py-4" style="color:var(--text-muted);">
                  Cargando usuarios...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
